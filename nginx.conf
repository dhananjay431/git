worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------
    # DNS resolver for proxy_pass with variables
    # ---------------------------------------------------------------
    resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;

    # ---------------------------------------------------------------
    # Upstreams — raw content from source-code hostings
    # ---------------------------------------------------------------
    upstream github_raw {
        server raw.githubusercontent.com:443;
        keepalive 16;
    }

    upstream gitlab_raw {
        server gitlab.com:443;
        keepalive 16;
    }

    upstream bitbucket_raw {
        server bitbucket.org:443;
        keepalive 16;
    }

    upstream gitea_raw {
        server gitea.com:443;
        keepalive 16;
    }

    upstream codeberg_raw {
        server codeberg.org:443;
        keepalive 16;
    }

    # Map upstream name to the correct Host header value for SNI
    map $hosting $upstream_host {
        github    "raw.githubusercontent.com";
        gitlab    "gitlab.com";
        bitbucket "bitbucket.org";
        gitea     "gitea.com";
        codeberg  "codeberg.org";
    }

    # Map upstream name to the upstream block name
    map $hosting $upstream_name {
        github    "github_raw";
        gitlab    "gitlab_raw";
        bitbucket "bitbucket_raw";
        gitea     "gitea_raw";
        codeberg  "codeberg_raw";
    }

    # ---------------------------------------------------------------
    # MIME type map for raw source files
    # ---------------------------------------------------------------
    map $uri $rawgit_mime {
        default                                       "text/plain";

        ~\.js$                                        "application/javascript";
        ~\.mjs$                                       "application/javascript";
        ~\.cjs$                                       "application/javascript";
        ~\.jsx$                                       "text/jsx";
        ~\.ts$                                        "application/typescript";
        ~\.tsx$                                       "text/tsx";
        ~\.css$                                       "text/css";
        ~\.html$                                      "text/html";
        ~\.htm$                                       "text/html";
        ~\.svg$                                       "image/svg+xml";
        ~\.json$                                      "application/json";
        ~\.xml$                                       "application/xml";
        ~\.yaml$                                      "text/yaml";
        ~\.yml$                                       "text/yaml";
        ~\.md$                                        "text/markdown";
        ~\.wasm$                                      "application/wasm";
        ~\.pdf$                                       "application/pdf";
        ~\.zip$                                       "application/zip";
        ~\.tar\.gz$                                   "application/gzip";
        ~\.gz$                                        "application/gzip";
        ~\.png$                                       "image/png";
        ~\.jpg$                                       "image/jpeg";
        ~\.jpeg$                                      "image/jpeg";
        ~\.gif$                                       "image/gif";
        ~\.webp$                                      "image/webp";
        ~\.ico$                                       "image/vnd.microsoft.icon";
        ~\.woff$                                      "font/woff";
        ~\.woff2$                                     "font/woff2";
        ~\.ttf$                                       "font/ttf";
        ~\.eot$                                       "application/vnd.ms-fontobject";
        ~\.otf$                                       "font/otf";
    }

    # ---------------------------------------------------------------
    # Cache
    # ---------------------------------------------------------------
    proxy_cache_path cache/rawgit levels=1:2 keys_zone=rawgit_cache:100m max_size=1g inactive=30d use_temp_path=off;

    # ---------------------------------------------------------------
    # Extract target URL from raw query string (preserves percent-encoding)
    # $arg_api URL-decodes the value which breaks encoded chars like %20
    # Using $args (raw) avoids this problem
    # ---------------------------------------------------------------
    map $args $proxy_target {
        ~^api=(.+)  $1;
        default     "";
    }

    # Extract hostname from target URL for SNI
    map $proxy_target $proxy_target_host {
        ~^https?://([^/:]+)  $1;
        default              "";
    }

    server {
        listen       8080;
        server_name  localhost;

        # ---------------------------------------------------------------
        # Global proxy settings
        # ---------------------------------------------------------------
        proxy_cache rawgit_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_ssl_verify off;

        # ---------------------------------------------------------------
        # Markdown viewer — serve rendered .md files
        # Dev, CDN and bare URL patterns ending in .md serve the viewer
        # which fetches raw content via /proxy and renders client-side
        # ---------------------------------------------------------------

        location ~ ^/dev/(github|gitlab|bitbucket|gitea|codeberg)/(.+\.md)$ {
            default_type text/html;
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *; media-src *;" always;
            root /usr/share/nginx/html;
            try_files /md-viewer.html =504;
        }

        location ~ ^/cdn/(github|gitlab|bitbucket|gitea|codeberg)/(.+\.md)$ {
            default_type text/html;
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *; media-src *;" always;
            root /usr/share/nginx/html;
            try_files /md-viewer.html =504;
        }

        location ~ ^/([^/]+)/([^/]+)/([^/]+)/(.+\.md)$ {
            default_type text/html;
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *; media-src *;" always;
            root /usr/share/nginx/html;
            try_files /md-viewer.html =504;
        }

        # ---------------------------------------------------------------
        # Development URLs — short cache
        # ---------------------------------------------------------------
        location ~ ^/dev/(github|gitlab|bitbucket|gitea|codeberg)/(.+) {
            set $hosting $1;
            set $rawpath $2;

            proxy_cache_valid 200 5m;
            proxy_cache_valid 301 302 404 1m;
            proxy_cache_key $scheme$host$uri;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Rawgit-Hosting $hosting;
            add_header Content-Type $rawgit_mime always;
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *; media-src *;" always;

            proxy_set_header Host $upstream_host;
            proxy_set_header User-Agent "rawgit-local/1.0";
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Content-Type;
            proxy_ssl_name $upstream_host;
            proxy_pass https://$upstream_name/$rawpath;
        }

        # ---------------------------------------------------------------
        # Production/CDN URLs — permanent cache (use tag/commit hash!)
        # ---------------------------------------------------------------
        location ~ ^/cdn/(github|gitlab|bitbucket|gitea|codeberg)/(.+) {
            set $hosting $1;
            set $rawpath $2;

            proxy_cache_valid 200 301 302 1y;
            proxy_cache_key $scheme$host$uri;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Rawgit-Hosting $hosting;
            add_header Cache-Control "public, immutable, max-age=31536000";
            add_header Content-Type $rawgit_mime always;
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *; media-src *;" always;

            proxy_set_header Host $upstream_host;
            proxy_set_header User-Agent "rawgit-local/1.0";
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Content-Type;
            proxy_ssl_name $upstream_host;
            proxy_pass https://$upstream_name/$rawpath;
        }

        # ---------------------------------------------------------------
        # Bare GitHub URL — /user/repo/ref/path  (defaults to GitHub, dev cache)
        # ---------------------------------------------------------------
        location ~ ^/([^/]+)/([^/]+)/([^/]+)/(.+) {
            set $gh_user  $1;
            set $gh_repo  $2;
            set $gh_ref   $3;
            set $gh_path  $4;

            proxy_cache_valid 200 5m;
            proxy_cache_valid 301 302 404 1m;
            proxy_cache_key $scheme$host$uri;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Rawgit-Hosting "github";
            add_header Content-Type $rawgit_mime always;
            add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:; font-src * data:; connect-src *; frame-src *; media-src *;" always;

            proxy_set_header Host "raw.githubusercontent.com";
            proxy_set_header User-Agent "rawgit-local/1.0";
            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Content-Type;
            proxy_ssl_name "raw.githubusercontent.com";
            proxy_pass https://github_raw/$gh_user/$gh_repo/$gh_ref/$gh_path;
        }

        # ---------------------------------------------------------------
        # Root page
        # ---------------------------------------------------------------
        location = / {
            return 301 https://dhananjaypro.in;
        }
        location /proxy {

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # OPTIONS request
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Block empty api param — $proxy_target comes from map on $args (raw)
        if ($proxy_target = "") {
            return 400 "Missing api parameter";
        }

        # Allow only HTTPS targets
        if ($proxy_target !~* ^https://) {
            return 403 "Invalid target URL — HTTPS required";
        }

        # Proxy settings
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_target_host;

        # Rewrite cookie domain so browser stores cookies under proxy host
        proxy_cookie_domain ~.* $host;

        # Remove Secure flag so cookies work over HTTP localhost
        proxy_cookie_flags ~.* nosecure;

        proxy_pass $proxy_target;

        proxy_http_version 1.1;

        proxy_set_header Host $proxy_target_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Browser-like headers — required by stricter APIs such as nseindia.com
        proxy_set_header Referer "https://www.nseindia.com/";
        proxy_set_header Origin "https://www.nseindia.com";
        proxy_set_header Accept "application/json, text/plain, */*";
        proxy_set_header Accept-Language "en-US,en;q=0.9";
        # Allow upstream compression (nginx can decompress if needed)
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # Pass Authorization
        proxy_set_header Authorization $http_authorization;

        # Use a browser-like User-Agent instead of curl/nginx defaults.
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36";

        # Timeouts
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        # Disable buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
